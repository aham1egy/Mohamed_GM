    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #fff;
            direction: rtl;
            overflow-x: hidden;
            background: url('https://e.top4top.io/p_3330a6vak1.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        /* الشريط العلوي */
        .top-bar {
            background: #4CAF50; /* لون أخضر */
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 25px 25px; /* حواف منحنية */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .top-bar .app-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .top-bar .icons {
            display: flex;
            gap: 15px;
        }

        .top-bar .icons .icon {
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .top-bar .icons .icon:hover {
            transform: scale(1.2);
        }

        /* الإعلان */
        .ad-banner {
            width: 100%;
            height: calc(100vh - 80px); /* ملء الشاشة تحت الشريط العلوي */
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* المحتوى الرئيسي */
        .container {
            padding: 20px;
            margin-top: 20px;
            display: none; /* مخفي في البداية */
        }

        /* تصميم البطاقات */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .game-card {
            background: rgba(0, 0, 0, 0.7); /* خلفية شبه شفافة */
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s ease;
            aspect-ratio: 3/4;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .game-card:hover {
            transform: scale(1.05);
            border-color: #4CAF50;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        .game-card h3 {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 1.1rem;
            font-weight: 300;
            color: #fff;
            z-index: 2;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* إطار اللعبة */
        #gameFrame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1001; /* تأكد من أن z-index أعلى من البنر */
    display: none;
    background: #000; /* خلفية سوداء لتغطية المحتوى */
}
        /* زر الإغلاق */
        .close-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
        }

        /* تصميم متجاوب */
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .top-bar .app-name {
                font-size: 1.2rem;
            }

            .top-bar .icons .icon {
                font-size: 1.2rem;
            }
        }
    </style>

    <script>
        // تفعيل التصنيفات
        document.querySelectorAll('.top-bar .icons .icon[data-category]').forEach(icon => {
            icon.addEventListener('click', () => {
                const category = icon.getAttribute('data-category');
                document.querySelector('.ad-banner').style.display = 'none'; // إخفاء الإعلان
                document.querySelector('.container').style.display = 'block'; // إظهار المحتوى

                // إخفاء جميع الألعاب
                document.querySelectorAll('.game-card').forEach(card => {
                    card.style.display = 'none';
                });

                // إظهار ألعاب التصنيف المحدد
                document.querySelectorAll(`.game-card[data-category="${category}"]`).forEach(card => {
                    card.style.display = 'block';
                });
            });
        });

        // تشغيل اللعبة
        document.querySelectorAll('.game-card').forEach(card => {
    card.addEventListener('click', () => {
        const gameUrl = card.getAttribute('data-game-url');
        document.getElementById('gameFrame').src = gameUrl;
        document.getElementById('gameFrame').style.display = 'block';
        document.querySelector('.close-btn').style.display = 'block';
        document.querySelector('.top-bar').style.display = 'none'; // إخفاء الشريط العلوي
        document.querySelector('.container').style.display = 'none'; // إخفاء المحتوى
        document.querySelector('.ad-banner').style.display = 'none'; // إخفاء البنر
            });
        });

        // إغلاق اللعبة
        function closeGame() {
    document.getElementById('gameFrame').style.display = 'none';
    document.querySelector('.close-btn').style.display = 'none';
    document.getElementById('gameFrame').src = '';
    document.querySelector('.top-bar').style.display = 'flex'; // إظهار الشريط العلوي
    document.querySelector('.container').style.display = 'block'; // إظهار المحتوى
    document.querySelector('.ad-banner').style.display = 'flex'; // إظهار البنر
        }

        // دعم اللمس
        document.addEventListener('touchstart', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
